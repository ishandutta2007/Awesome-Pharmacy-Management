<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; }
      .subtitle { font: 20px sans-serif; fill: white; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .pill { animation: float 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="200" rx="20" ry="20" fill="url(#grad1)" />
  <text x="50" y="80" class="title">Awesome Pharmacy Management</text>
  <text x="50" y="120" class="subtitle">Curated list of SaaS and Open-Source Solutions 💊</text>
  <g class="pill" transform="translate(650, 80)">
    <rect width="60" height="30" rx="15" ry="15" fill="#fff" />
    <path d="M 30 0 h 15 a 15 15 0 0 1 15 15 a 15 15 0 0 1 -15 15 h -15 z" fill="#ff4b4b" />
  </g>
  <g class="pill" transform="translate(620, 120)" style="animation-delay: 1s;">
    <rect width="60" height="30" rx="15" ry="15" fill="#fff" />
    <path d="M 0 15 a 15 15 0 0 1 15 -15 h 15 v 30 h -15 a 15 15 0 0 1 -15 -15 z" fill="#4caf50" />
  </g>
</svg>
